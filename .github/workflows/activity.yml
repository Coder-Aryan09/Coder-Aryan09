name: Automated Contribution Activity

on:
  schedule:
    # Triggers every day at 12:00 PM UTC (Adjust as needed)
    - cron: '0 12 * * *'
  workflow_dispatch: # Allows you to trigger it manually for testing

jobs:
  update-activity:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Crucial for allowing the action to commit back to the repo
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Make a Change
        run: |
          echo "Last active on: $(date)" > activity.txt

      - name: Commit and Push Changes
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add activity.txt
          git commit -m "chore: update contribution activity [skip ci]" || echo "No changes to commit"
          git push
